name: No AI Footprint

# Auto-provisioned by the infrastructure repo's modules/github/repo/ module.
# DO NOT EDIT IN THIS REPO — edits will be reverted on next Terraform apply.
# To modify this check, edit modules/github/repo/files/no-ai-footprint.yml
# in tmx-group/infrastructure.

# Runs on EVERY pull request regardless of target branch. App repos
# (dev → staging → production) have no `main`, and the check is wired as a
# required status context on all protected branches, so it must fire on PRs
# into any of them — not just staging/main. Branch-model-agnostic by design.
on:
  pull_request:

jobs:
  scan:
    name: Scan for AI use
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Determine changed files
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > changed-files.txt
          echo "Changed files:"
          cat changed-files.txt

      - name: Scan filenames
        run: |
          DISALLOWED='^(CLAUDE\.md|\.claude/|\.cursor/|\.aider|\.continue/|\.copilotchat/|\.copilot-config\.json|\.aiconfig|\.gpt/|\.codeium/)'
          if grep -E "$DISALLOWED" changed-files.txt; then
            echo "::error::Disallowed AI tool config file(s) added. See infrastructure/docs/policies/ai-tooling.md."
            exit 1
          fi

      - name: Scan file contents
        run: |
          # INFRA-50 — the trailer pattern names an AI CO-AUTHOR rather than
          # co-authorship itself. Bare `Co-authored-by` matched every human
          # trailer too; see the commit-message scan below for why that is not a
          # theoretical concern.
          PATTERNS=(
            'Generated by Claude'
            '[Cc]o-?[Aa]uthored[ -][Bb]y:.*([Cc]laude|[Cc]opilot|[Cc]hat[Gg]PT|[Oo]pen[Aa][Ii]|[Gg][Pp][Tt]-|[Cc]ursor|[Aa]ider|[Cc]odeium|[Ww]indsurf|[Dd]evin|\[bot\]|noreply@anthropic)'
            '🤖 Generated with'
            'Created by AI'
            'Created with AI'
            'Auto-generated by .*AI'
            'Generated with Claude Code'
          )
          # Files that legitimately contain the patterns (because they're the
          # workflow itself or local policy docs). Kept in sync with
          # tmx-group/infrastructure modules/github/repo/files/no-ai-footprint.yml.
          ALLOWLIST='^(\.github/workflows/no-ai-footprint\.yml|docs/policies/.*\.md|CONTRIBUTING\.md)$'
          FOUND=0
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            if echo "$file" | grep -E "$ALLOWLIST" >/dev/null 2>&1; then
              echo "Skipping policy-defining file: $file"
              continue
            fi
            file "$file" | grep -q "text" || continue
            for pattern in "${PATTERNS[@]}"; do
              if grep -nE "$pattern" "$file" 2>/dev/null; then
                echo "::error file=$file::AI use detected: $pattern"
                FOUND=1
              fi
            done
          done < changed-files.txt
          [ "$FOUND" -eq 0 ] || exit 1

      # INFRA-50 — this scan matched a bare `Co-authored-by`, which is not what
      # the policy is about. Two consequences, both seen in production:
      #
      #   1. It flagged HUMAN co-authorship. `Co-authored-by: Rory Oliver
      #      <i@roryoliver.com>` is a person crediting a person.
      #
      #   2. GitHub ADDS that trailer itself when a PR is squash-merged with more
      #      than one contributor. It therefore does not exist on the branch this
      #      scan runs against, and only comes into being on the merged commit —
      #      after the gate has run and can no longer see it. Every one of those
      #      PRs passed; the trailer then failed every LATER pull request whose
      #      range spanned them.
      #
      # That made the check unsatisfiable rather than strict: it cannot be fixed
      # by rewriting commits, because the trailer is added after the last point a
      # contributor controls the message. On tmx-group/thea-mothership it blocked
      # the dev → staging → production promotion ladder outright — four commits
      # carrying a human trailer meant every promote PR failed, permanently, and
      # each had to be merged with --admin.
      #
      # The pattern now requires the co-author to LOOK like a tool. A commit
      # actually authored by an agent still carries `Generated with Claude Code`,
      # `🤖 Generated with` or a bot trailer, all of which still fail.
      - name: Scan commit messages
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if git log --format='%B' "$BASE..$HEAD" | grep -nE '[Cc]o-?[Aa]uthored[ -][Bb]y:.*([Cc]laude|[Cc]opilot|[Cc]hat[Gg]PT|[Oo]pen[Aa][Ii]|[Gg][Pp][Tt]-|[Cc]ursor|[Aa]ider|[Cc]odeium|[Ww]indsurf|[Dd]evin|\[bot\]|noreply@anthropic)|Generated by Claude|Generated with Claude Code|🤖 Generated with|Created (by|with) AI'; then
            echo "::error::AI use detected in commit message(s). Rewrite commits."
            exit 1
          fi
